# docker-compose.yml — orchestrates the three services of the Lab 1 system:
#
#   client --> nginx (reverse proxy, :80) --> app (FastAPI, :5200) --> db (PostgreSQL, :5432)
#
# Assignment requirements satisfied here:
#   * all services run on a dedicated network (`mywebapp_net`), NOT the
#     default bridge network;
#   * PostgreSQL data lives in a named volume (`db_data`) on disk, so it
#     survives container restarts, `docker compose down`, and host reboots;
#   * only nginx publishes a port to the host — `app` and `db` are reachable
#     only from inside the private network, mirroring the Lab 1 rule that
#     clients go through the reverse proxy and the database is not exposed.

name: mywebapp

services:
  # --- PostgreSQL database -------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: mywebapp
      # Must match database.password in config.toml.
      POSTGRES_PASSWORD: mywebapp_secret
    volumes:
      # Named volume -> data persists independently of the container.
      - db_data:/var/lib/postgresql/data
    networks:
      - mywebapp_net
    healthcheck:
      # `app` waits for this to pass before starting (see depends_on below).
      test: ["CMD-SHELL", "pg_isready -U mywebapp -d mywebapp"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- FastAPI web application --------------------------------------------
  app:
    build: .
    environment:
      MYWEBAPP_CONFIG: /etc/mywebapp/config.toml
    volumes:
      - ./config.toml:/etc/mywebapp/config.toml:ro
    networks:
      - mywebapp_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No `ports:` — the app is reachable only via nginx, exactly as in Lab 1
    # where the application listened on a private address.

  # --- nginx reverse proxy -------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-mywebapp.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mywebapp_net
    depends_on:
      - app
    restart: unless-stopped

networks:
  # Dedicated network — not the default bridge.
  mywebapp_net:
    driver: bridge

volumes:
  # Named volume for PostgreSQL data — survives restarts and reboots.
  db_data:
