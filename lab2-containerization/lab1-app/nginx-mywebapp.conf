# nginx reverse proxy for the Lab 1 web application — container edition.
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf
# (see docker-compose.yml), replacing the image's stock default site.
#
# Difference from the bare-metal Lab 1 config: the upstream is the
# docker-compose service name `app` (resolved over the project's private
# network) instead of 127.0.0.1.
#
# As in Lab 1, only the root endpoint and the business endpoints are exposed
# to the outside; /health/* and everything else return 404.

upstream mywebapp_backend {
    server app:5200;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/mywebapp_access.log;
    error_log  /var/log/nginx/mywebapp_error.log;

    # Root endpoint — lists the business endpoints (text/html only).
    location = / {
        proxy_pass http://mywebapp_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Business-logic endpoints: /items and /items/{id}.
    location /items {
        proxy_pass http://mywebapp_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (including /health/*) is not exposed.
    location / {
        return 404;
    }
}
