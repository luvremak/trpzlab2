# nginx reverse proxy for mywebapp.
# Installed to /etc/nginx/sites-available/mywebapp and symlinked into
# /etc/nginx/sites-enabled/. The default site is removed by the installer.
#
# Only the root endpoint ("/") and the business-logic endpoints ("/items*")
# are exposed to the outside world. The health endpoints ("/health/*") and
# any other path are NOT proxied — nginx answers them with 404.

upstream mywebapp_backend {
    server 127.0.0.1:5200;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/mywebapp_access.log;
    error_log  /var/log/nginx/mywebapp_error.log;

    # Root endpoint — lists the business endpoints (text/html only).
    location = / {
        proxy_pass http://mywebapp_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Business-logic endpoints: /items and /items/{id}.
    location /items {
        proxy_pass http://mywebapp_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (including /health/*) is not exposed.
    location / {
        return 404;
    }
}
